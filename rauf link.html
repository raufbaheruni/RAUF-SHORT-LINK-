<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAUF BAHERUNI - Link Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .bg-animation span {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        /* Header */
        header {
            text-align: center;
            padding: 40px 0;
        }
        
        .logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-size: 18px;
            color: #a0a0a0;
            font-weight: 300;
        }
        
        /* Main Card */
        .main-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #e94560;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #e94560;
            background: rgba(0,0,0,0.5);
        }
        
        input[type="text"]::placeholder {
            color: #666;
        }
        
        /* Button */
        .btn-primary {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(233,69,96,0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255,255,255,0.1),
                transparent
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        
        /* Results Section */
        .results {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            border-left: 4px solid #e94560;
        }
        
        .results.show {
            display: block;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #e94560;
        }
        
        .link-box {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ff88;
            border: 1px solid rgba(0,255,136,0.3);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-secondary {
            padding: 12px 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .btn-download {
            background: linear-gradient(135deg, #00b894, #00cec9);
            border: none;
        }
        
        .btn-download:hover {
            box-shadow: 0 10px 20px rgba(0,184,148,0.3);
        }
        
        /* QR Code */
        .qr-section {
            margin-top: 25px;
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        #qrcode {
            display: inline-block;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #e94560;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
            font-size: 14px;
        }
        
        footer a {
            color: #e94560;
            text-decoration: none;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #00b894;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .logo { font-size: 32px; }
            .main-card { padding: 25px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <span style="left:10%;animation-delay:0s;"></span>
        <span style="left:20%;animation-delay:2s;"></span>
        <span style="left:30%;animation-delay:4s;"></span>
        <span style="left:40%;animation-delay:1s;"></span>
        <span style="left:50%;animation-delay:3s;"></span>
        <span style="left:60%;animation-delay:5s;"></span>
        <span style="left:70%;animation-delay:2.5s;"></span>
        <span style="left:80%;animation-delay:1.5s;"></span>
        <span style="left:90%;animation-delay:4.5s;"></span>
    </div>

    <div class="container">
        <header>
            <h1 class="logo">RAUF BAHERUNI</h1>
            <p class="tagline">Premium Link Shortener & Direct Download</p>
        </header>

        <div class="main-card">
            <div class="input-group">
                <label>🔗 Google Drive Link</label>
                <input type="text" id="gdriveUrl" placeholder="https://drive.google.com/file/d/.../view" />
            </div>

            <div class="input-group">
                <label>🏷️ Custom Name (Optional)</label>
                <input type="text" id="customName" value="RAUF" placeholder="RAUF" />
            </div>

            <button class="btn-primary" onclick="generateLink()">
                ⚡ Generate Short Link
            </button>

            <div class="results" id="results">
                <h3 class="result-title">✅ Your Short Link is Ready</h3>
                
                <div class="link-box" id="shortLink"></div>
                
                <div class="btn-group">
                    <button class="btn-secondary" onclick="copyToClipboard()">
                        📋 Copy Link
                    </button>
                    <a class="btn-secondary btn-download" id="directLink" href="#" target="_blank">
                        ⬇️ Direct Download
                    </a>
                    <button class="btn-secondary" onclick="shareLink()">
                        📤 Share
                    </button>
                </div>

                <div class="qr-section">
                    <p>📱 Scan QR Code to Download</p>
                    <div id="qrcode"></div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalLinks">0</div>
                <div class="stat-label">Links Created</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">∞</div>
                <div class="stat-label">Unlimited</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">100%</div>
                <div class="stat-label">Free</div>
            </div>
        </div>

        <footer>
            <p>Made with ❤️ by <strong>RAUF BAHERUNI</strong></p>
            <p>Hosted on <a href="https://github.com" target="_blank">GitHub Pages</a></p>
        </footer>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">✅ Link copied to clipboard!</div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        // Extract file ID from Google Drive URL
        function extractFileId(url) {
            const patterns = [
                /\/file\/d\/([a-zA-Z0-9_-]+)/,
                /id=([a-zA-Z0-9_-]+)/,
                /\/open\?id=([a-zA-Z0-9_-]+)/,
                /([a-zA-Z0-9_-]{25,})/
            ];
            
            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        // Generate short link
        function generateLink() {
            const url = document.getElementById('gdriveUrl').value.trim();
            const customName = document.getElementById('customName').value.trim() || 'RAUF';
            
            if (!url) {
                showToast('⚠️ Please enter a Google Drive link!');
                return;
            }
            
            const fileId = extractFileId(url);
            if (!fileId) {
                showToast('❌ Invalid Google Drive link!');
                return;
            }
            
            // Create data object
            const data = {
                id: fileId,
                name: customName,
                time: Date.now()
            };
            
            // Encode to base64
            const encoded = btoa(JSON.stringify(data));
            
            // Generate short URL
            const baseUrl = window.location.origin + window.location.pathname;
            const shortUrl = `${baseUrl}?rauf=${encoded}`;
            
            // Direct download URL
            const directUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
            
            // Display results
            document.getElementById('shortLink').textContent = shortUrl;
            document.getElementById('directLink').href = directUrl;
            document.getElementById('results').classList.add('show');
            
            // Generate QR
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), {
                text: shortUrl,
                width: 150,
                height: 150,
                colorDark: '#1a1a2e',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
            
            // Update stats
            updateStats();
            
            // Auto copy
            copyToClipboard();
        }

        // Copy to clipboard
        function copyToClipboard() {
            const link = document.getElementById('shortLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                showToast('✅ Link copied!');
            });
        }

        // Share link
        function shareLink() {
            const link = document.getElementById('shortLink').textContent;
            if (navigator.share) {
                navigator.share({
                    title: 'RAUF BAHERUNI - Download Link',
                    url: link
                });
            } else {
                copyToClipboard();
            }
        }

        // Show toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Update stats
        function updateStats() {
            let count = parseInt(localStorage.getItem('rauf_links_count') || '0');
            count++;
            localStorage.setItem('rauf_links_count', count);
            document.getElementById('totalLinks').textContent = count;
        }

        // Check for redirect on page load
        window.onload = function() {
            // Load stats
            const count = localStorage.getItem('rauf_links_count') || '0';
            document.getElementById('totalLinks').textContent = count;
            
            // Check for short link
            const params = new URLSearchParams(window.location.search);
            const rauf = params.get('rauf');
            
            if (rauf) {
                try {
                    const data = JSON.parse(atob(rauf));
                    const downloadUrl = `https://drive.google.com/uc?export=download&id=${data.id}`;
                    
                    // Show download page
                    document.body.innerHTML = `
                        <div style="min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg, #1a1a2e, #16213e);font-family:Poppins,sans-serif;padding:20px;">
                            <div style="text-align:center;max-width:500px;">
                                <h1 style="font-size:42px;background:linear-gradient(135deg, #e94560, #ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;">RAUF BAHERUNI</h1>
                                <div style="background:rgba(255,255,255,0.05);padding:40px;border-radius:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);">
                                    <div style="font-size:60px;margin-bottom:20px;">📥</div>
                                    <h2 style="color:#fff;margin-bottom:15px;">Your Download is Ready</h2>
                                    <p style="color:#888;margin-bottom:30px;">File ID: ${data.id}</p>
                                    <a href="${downloadUrl}" style="display:inline-block;padding:18px 40px;background:linear-gradient(135deg, #e94560, #ff6b6b);color:#fff;text-decoration:none;border-radius:12px;font-weight:600;font-size:18px;transition:all 0.3s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">
                                        ⬇️ Download Now
                                    </a>
                                    <p style="color:#666;margin-top:20px;font-size:14px;">If download doesn't start automatically, click the button above</p>
                                </div>
                                <p style="color:#444;margin-top:30px;font-size:12px;">Powered by RAUF BAHERUNI Link Shortener</p>
                            </div>
                        </div>
                    `;
                    
                    // Auto download
                    setTimeout(() => {
                        window.location.href = downloadUrl;
                    }, 2000);
                    
                } catch (e) {
                    showToast('❌ Invalid link!');
                }
            }
        };
    </script>
</body>
</html>
